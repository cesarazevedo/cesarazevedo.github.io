<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Condomínio Parque dos Rios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    [data-theme="dark"] {
      --bg: #0f1117;
      --card-bg: #1e2130;
      --card-border: #2a2f45;
      --text-h: #f1f5f9;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --grid-line: rgba(255,255,255,.03);
      --shadow: rgba(0,0,0,.4);
      --toggle-bg: #1e2130;
      --toggle-border: #2a2f45;
      --divider: rgba(255,255,255,.06);
      --tag-bg: rgba(59,130,246,.15);
      --tag-color: #93c5fd;
    }
    [data-theme="light"] {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --card-border: #dde3ec;
      --text-h: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --grid-line: rgba(0,0,0,.04);
      --shadow: rgba(0,0,0,.10);
      --toggle-bg: #ffffff;
      --toggle-border: #dde3ec;
      --divider: rgba(0,0,0,.08);
      --tag-bg: #dbeafe;
      --tag-color: #1d4ed8;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 16px 60px;
      transition: background .3s;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .theme-toggle {
      position: fixed; top: 18px; right: 18px;
      background: var(--toggle-bg);
      border: 1px solid var(--toggle-border);
      border-radius: 999px; padding: 6px 14px;
      cursor: pointer; display: flex; align-items: center; gap: 7px;
      font-size: .82rem; color: var(--text-sub);
      transition: background .3s, border-color .3s, color .2s;
      user-select: none; box-shadow: 0 2px 8px var(--shadow); z-index: 10;
    }
    .theme-toggle:hover { color: var(--text-h); }

    .page-wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 20px; }

    .header {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; text-align: center; padding-bottom: 8px;
    }
    .header-icon { font-size: 2.4rem; margin-bottom: 4px; }
    .header h1 { color: var(--text-h); font-size: 1.4rem; font-weight: 700; letter-spacing: -.3px; }
    .header p { color: var(--text-muted); font-size: .85rem; }

    .section {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 20px var(--shadow);
      transition: background .3s, border-color .3s;
    }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 14px; border-bottom: 1px solid var(--divider);
    }
    .section-title {
      color: var(--text-h); font-size: .95rem; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .section-count {
      background: var(--tag-bg); color: var(--tag-color);
      font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    }
    .section-body { padding: 4px 0; }

    .comunicado {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 20px; border-bottom: 1px solid var(--divider);
      transition: background .15s;
    }
    .comunicado:last-child { border-bottom: none; }
    .comunicado:hover { background: color-mix(in srgb, var(--card-border) 30%, transparent); }
    .comunicado-icon {
      font-size: 1.35rem; width: 40px; height: 40px; border-radius: 10px;
      background: color-mix(in srgb, #3b82f6 12%, transparent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .comunicado-body { flex: 1; min-width: 0; }
    .comunicado-titulo { color: var(--text-h); font-size: .92rem; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .comunicado-texto { color: var(--text-sub); font-size: .82rem; line-height: 1.5; margin-bottom: 6px; }
    .comunicado-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meta-tag { font-size: .7rem; color: var(--text-muted); }
    .badge-val {
      background: rgba(234,179,8,.15); color: #fbbf24;
      font-size: .68rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    }
    [data-theme="light"] .badge-val { background: #fef9c3; color: #92400e; }

    .empty {
      padding: 36px 20px; text-align: center; color: var(--text-muted); font-size: .85rem;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .empty-icon { font-size: 2rem; opacity: .4; }
    .loading {
      padding: 32px 20px; text-align: center; color: var(--text-muted); font-size: .85rem;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--card-border);
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      padding: 20px; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2);
      border-radius: 10px; color: #fca5a5; font-size: .83rem; line-height: 1.5; margin: 12px;
    }
    [data-theme="light"] .error-msg { color: #b91c1c; }

    footer { margin-top: 8px; color: var(--text-muted); font-size: .75rem; text-align: center; }
  </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-icon">☀️</span>
  <span id="theme-label">Claro</span>
</button>

<div class="page-wrap">
  <div class="header">
    <div class="header-icon">🏢</div>
    <h1>Condomínio Parque dos Rios</h1>
    <p>Comunicados e avisos do condomínio</p>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">
        📢 Comunicados Recentes
        <span class="section-count" id="count-badge" style="display:none">0</span>
      </div>
    </div>
    <div class="section-body" id="comunicados-body">
      <div class="loading"><div class="spinner"></div>Carregando…</div>
    </div>
  </div>

  <footer id="footer-ts"></footer>
</div>

<script>
  const SHEET_ID = '1kPpRfPsT3sL-6-5gCZzLwbb4zvxUVBOZHI7CtQ5GU2Q';

  /* ── Tema ── */
  const root = document.documentElement;
  const savedTheme = localStorage.getItem('theme') || 'dark';
  root.setAttribute('data-theme', savedTheme);
  updateThemeBtn(savedTheme);
  function toggleTheme() {
    const t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    updateThemeBtn(t);
  }
  function updateThemeBtn(t) {
    document.getElementById('theme-icon').textContent = t === 'dark' ? '☀️' : '🌙';
    document.getElementById('theme-label').textContent = t === 'dark' ? 'Claro' : 'Escuro';
  }

  /* ── CSV parse (idêntico ao blocoi) ── */
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (inQ && text[i+1] === '"') { field += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        row.push(field); field = '';
      } else if ((ch === '\n' || ch === '\r') && !inQ) {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(c => c !== '')) rows.push(row);
        row = [];
      } else {
        field += ch;
      }
    }
    if (field || row.length) { row.push(field); if (row.some(c => c !== '')) rows.push(row); }
    return rows;
  }

  /* ── Fetch via gviz (mesmo método do blocoi) ── */
  async function fetchComunicados() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Comunicados`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return parseCSV(await res.text());
  }

  /* ── Filtros ── */
  function parseComunicados(rows) {
    return rows.slice(1)
      .filter(r => (r[0] || '').trim())
      .map(r => {
        const ativo  = (r[3] || '').trim();
        const valStr = (r[4] || '').trim();
        let validade = null;
        if (valStr) {
          const p = valStr.split('/');
          validade = p.length === 3
            ? new Date(+p[2], +p[1] - 1, +p[0])
            : new Date(valStr);
        }
        return {
          titulo:   r[0] || '',
          texto:    r[1] || '',
          data:     r[2] || '',
          ativo:    ativo === '' || ativo.toUpperCase() === 'TRUE',
          validade
        };
      })
      .filter(c => c.ativo && (!c.validade || c.validade >= new Date()));
  }

  /* ── Render ── */
  function render(comunicados) {
    const badge = document.getElementById('count-badge');
    badge.textContent = comunicados.length;
    badge.style.display = comunicados.length ? '' : 'none';

    document.getElementById('footer-ts').textContent =
      'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    if (!comunicados.length) {
      document.getElementById('comunicados-body').innerHTML =
        '<div class="empty"><div class="empty-icon">📭</div>Nenhum comunicado ativo no momento.</div>';
      return;
    }

    document.getElementById('comunicados-body').innerHTML = comunicados.map(c => {
      const emojiMatch = c.titulo.match(/^(\p{Emoji_Presentation}|\p{Emoji}️)/u);
      const emoji = emojiMatch ? emojiMatch[0] : '📌';
      const titulo = c.titulo.replace(/^(\p{Emoji_Presentation}|\p{Emoji}️)\s*/u, '').trim();
      const dataTag  = c.data     ? `<span class="meta-tag">🗓 ${esc(c.data)}</span>` : '';
      const validTag = c.validade
        ? `<span class="badge-val">até ${esc(c.validade.toLocaleDateString('pt-BR'))}</span>`
        : '';
      return `
        <div class="comunicado">
          <div class="comunicado-icon">${emoji}</div>
          <div class="comunicado-body">
            <div class="comunicado-titulo">${esc(titulo)}</div>
            <div class="comunicado-texto">${esc(c.texto)}</div>
            <div class="comunicado-meta">${dataTag}${validTag}</div>
          </div>
        </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Init ── */
  fetchComunicados()
    .then(rows => render(parseComunicados(rows)))
    .catch(err => {
      document.getElementById('comunicados-body').innerHTML =
        `<div class="error-msg">⚠️ Erro ao carregar comunicados: ${esc(err.message)}<br>
        <small>Verifique se você está logado no Google e se a planilha está acessível.</small></div>`;
      document.getElementById('footer-ts').textContent = '';
    });
</script>
</body>
</html>
